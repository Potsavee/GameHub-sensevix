services:
  - type: web
    name: game-review-api
    runtime: go
    rootDir: Backend/gamehub
    buildCommand: go build -o app .
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
